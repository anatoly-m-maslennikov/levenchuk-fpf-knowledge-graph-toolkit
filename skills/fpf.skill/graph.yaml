nodes:
  - id: help
    command: help
    aliases: ["?", commands, usage, справка, помощь, команды, "как пользоваться"]
    localized_commands: {ru: справка}
    description: Show the general area selector or one area-specific help page.
    prompt: prompts/help/en/fpf-help.md
    localized_prompts: {ru: prompts/help/ru/fpf-help.md}
    persist_report: false
    exact_only: true
    keywords: []
  - id: plan
    command: plan
    aliases: [planner, route, workflow, "which skill", план, планировщик, маршрут, "рабочий процесс", "какой навык"]
    localized_commands: {ru: план}
    description: Return the smallest useful ordered FPF call plan or validate an explicit analytical stack without executing it.
    prompt: prompts/fpf-plan.md
    persist_report: false
    exact_only: false
    keywords: [plan, route, sequence, workflow, "which skill", "what should i use", then, план, маршрут, последовательност, "рабочий процесс", "какой навык", "что использовать", затем]
