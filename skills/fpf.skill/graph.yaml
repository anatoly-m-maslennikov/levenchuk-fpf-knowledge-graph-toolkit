edges:
  - {from: problem-frame, to: structure-recover, relation: bounds current-state recovery}
  - {from: problem-frame, to: applicability-scan, relation: supplies a bounded question}
  - {from: problem-frame, to: sota-harvest, relation: supplies a bounded research question}
  - {from: problem-frame, to: options-explore, relation: supplies an accepted problem-side result}
  - {from: problem-frame, to: evaluation-design, relation: supplies target and receiving use}
  - {from: applicability-scan, to: structure-recover, relation: may identify structures to recover}
  - {from: applicability-scan, to: sota-harvest, relation: may clarify research frame}
  - {from: applicability-scan, to: options-explore, relation: may supply applicable patterns}
  - {from: applicability-scan, to: evaluation-design, relation: may supply governing evaluation patterns}
  - {from: sota-harvest, to: options-explore, relation: supplies current evidence}
  - {from: sota-harvest, to: evaluation-design, relation: may supply current evaluation practices}
  - {from: structure-recover, to: options-explore, relation: supplies the current-state structure}
  - {from: structure-recover, to: evaluation-design, relation: supplies exact bearers and boundaries}
  - {from: structure-recover, to: design-challenge, relation: supplies the recovered current state}
  - {from: options-explore, to: evaluation-design, relation: supplies candidates and comparison needs}
  - {from: options-explore, to: design-challenge, relation: supplies a candidate proposal}
  - {from: options-explore, to: decision-synthesize, relation: supplies evaluated alternatives}
  - {from: evaluation-design, to: design-challenge, relation: supplies declared criteria and tests}
  - {from: evaluation-design, to: decision-synthesize, relation: supplies comparable evaluation evidence}
  - {from: evaluation-design, to: quality-improve, relation: supplies a rerunnable evaluation frame}
  - {from: design-challenge, to: decision-synthesize, relation: supplies challenge evidence}
  - {from: design-challenge, to: quality-improve, relation: accepted findings may define a bounded improvement target}
  - {from: decision-synthesize, to: quality-improve, relation: may authorize a bounded improvement}
  - {from: quality-improve, to: alignment-audit, relation: supplies changed target and rerun evidence}
  - {from: design-challenge, to: alignment-audit, relation: applied repairs may enter closure audit}
