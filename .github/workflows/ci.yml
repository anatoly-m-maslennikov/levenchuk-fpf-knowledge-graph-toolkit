name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check out canonical FPF source revision
        uses: actions/checkout@v4
        with:
          repository: ailev/FPF
          ref: 563f4c8e06a319cbd375b66cdbb2df27a5f8b9ef
          fetch-depth: 0
          path: .runtime/original-fpf
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Synchronize project environment
        run: uv sync --locked
      - name: Initialize CI control panel
        run: |
          cp .caprmedio/settings.toml.example .caprmedio/settings.toml
          sed -i 's#../../Repos/FPF#.runtime/original-fpf#' .caprmedio/settings.toml
      - name: Compile scripts
        run: uv run -m compileall -q scripts
      - name: Validate script architecture
        run: uv run -m scripts.validate_script_architecture
      - name: Run deterministic maintenance suite
        run: uv run -m scripts.graph_fpf_convert_from_original.run_tests

  auto-merge-owner-pr:
    name: auto-merge owner PR
    needs: validate
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'anatoly-m-maslennikov' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'dev' &&
          github.event.pull_request.base.ref == 'main' &&
          !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge validated owner PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --merge --match-head-commit "$HEAD_SHA"
