name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check out canonical FPF source revision
        uses: actions/checkout@v4
        with:
          repository: ailev/FPF
          ref: 7f7c592f4d633e54cdb202d622d6e0e05df41517
          fetch-depth: 0
          path: .runtime/original-fpf
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize CI control panel
        run: |
          cp .caprmedio/settings.toml.example .caprmedio/settings.toml
          python3 -c 'from pathlib import Path; p = Path(".caprmedio/settings.toml"); p.write_text(p.read_text().replace("../../Repos/FPF", ".runtime/original-fpf"))'
      - name: Compile scripts
        run: python3 -X pycache_prefix=.runtime/pycache -m compileall -q scripts
      - name: Validate script architecture
        run: python3 -X pycache_prefix=.runtime/pycache -m scripts.validate_script_architecture
      - name: Run deterministic maintenance suite
        run: python3 -X pycache_prefix=.runtime/pycache -m scripts.graph_fpf_convert_from_original.run_tests

  auto-merge-owner-pr:
    name: auto-merge owner PR
    needs: validate
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'anatoly-m-maslennikov' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'dev' &&
          github.event.pull_request.base.ref == 'main' &&
          !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge validated owner PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --merge --match-head-commit "$HEAD_SHA"
